name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace and fuzz crate)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo check (no default features)
        run: cargo check --locked --no-default-features

      - name: cargo test (unit tests only — no features)
        run: cargo test --locked --lib

      - name: cargo test (all features, incl. integration tests)
        run: cargo test --locked --all-features

      - name: cargo clippy (all features)
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: cargo clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: cargo doc (catches broken links)
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # The declared `rust-version` is a promise to downstream users; this is what keeps it true.
  # It reads the number from Cargo.toml, so the two cannot drift. The pinned toolchain
  # (rust-toolchain.toml) is overridden with `+`.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked --all-features
          cargo "+$msrv" check --locked --no-default-features
